<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Ground – Realistic Blue Sky</title>
    <style>
        html,
        body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a24;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
            display: block;
            cursor: default;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #eee;
            font-family: 'Consolas', 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 16px 22px;
            border-radius: 10px;
            pointer-events: none;
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            min-width: 260px;
            z-index: 10;
        }
        #ui h3 {
            margin: 0 0 8px 0;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #b8d4e3;
        }
        #ui p {
            margin: 4px 0;
            font-size: 14px;
            opacity: 0.9;
        }
        #ui span {
            color: #f0c060;
            font-weight: 600;
        }
        .key-hint {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 8px;
        }
        #lock-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-family: sans-serif;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 24px;
            border-radius: 30px;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: opacity 0.25s;
            z-index: 10;
        }
        #lock-hint.hidden {
            opacity: 0;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js">
    </script>
</head>
<body>

    <div id="ui">
        <h3>⬡ Infinite Ground · Blue Sky</h3>
        <p>Position: <span id="posDisplay">X: 0 &nbsp; Y: 0 &nbsp; Z: 0</span></p>
        <p>Active Tiles: <span id="tileDisplay">0</span></p>
        <p style="font-size:12px; opacity:0.5;">Yaw: <span id="yawDisplay">0</span>° &nbsp; Pitch: <span id="pitchDisplay">0</span>°</p>
        <div class="key-hint">
            W/S &nbsp; Forward/Back &nbsp;·&nbsp; A/D &nbsp; Strafe &nbsp;·&nbsp; Q/E &nbsp; Height
            <br />🖱️ Click canvas &amp; move mouse to look
        </div>
    </div>
    <div id="lock-hint">🖱️ Click to lock mouse</div>

    <canvas id="renderCanvas" tabindex="1"></canvas>

    <script>
        (function() {
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true });

            // ─── CONFIG ────────────────────────────────────────────────
            const TILE_SIZE = 1000;
            const VIEW_DISTANCE = 5000;
            const MOVE_SPEED = 50;
            const TILE_RADIUS = Math.ceil(VIEW_DISTANCE / TILE_SIZE);
            const MOUSE_SENSITIVITY = 0.003;
            const TEXTURE_REPEAT_PER_UNIT = 0.8;
            const TEXTURE_URL = "desert_sand.jpg";

            // ─── SKY & FOG COLOR (Now a vivid, realistic blue) ──────
            // Previously: (0.55, 0.60, 0.72) – greyish
            // Updated to a bright, natural sky blue:
            const horizonColor = new BABYLON.Color3(0.53, 0.78, 0.98);

            // ─── SCENE SETUP ──────────────────────────────────────────
            const createScene = function() {
                const scene = new BABYLON.Scene(engine);

                // ── Scene background, fog, and ambient ──
                scene.clearColor = horizonColor;
                scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
                scene.fogColor = horizonColor; // Fog matches the new blue sky
                scene.fogStart = 3500;
                scene.fogEnd = 5200;
                scene.ambientColor = new BABYLON.Color3(0.35, 0.38, 0.42);

                // ─── LIGHTING (Z‑up) ──────────────────────────────────
                const hemi = new BABYLON.HemisphericLight(
                    "hemi",
                    new BABYLON.Vector3(0, 0, 1),
                    scene
                );
                hemi.intensity = 0.85;
                hemi.groundColor = new BABYLON.Color3(0.35, 0.38, 0.45);

                const dirLight = new BABYLON.DirectionalLight(
                    "dirLight",
                    new BABYLON.Vector3(-1.2, -0.8, -2.5),
                    scene
                );
                dirLight.intensity = 1.1;

                const fillLight = new BABYLON.DirectionalLight(
                    "fillLight",
                    new BABYLON.Vector3(0.6, 1.0, -1.8),
                    scene
                );
                fillLight.intensity = 0.55;

                // ─── CAMERA (target‑based orientation) ──────────────
                const camera = new BABYLON.FreeCamera(
                    "camera",
                    new BABYLON.Vector3(0, -2000, 80),
                    scene
                );
                camera.upVector = new BABYLON.Vector3(0, 0, 1);

                let yaw = 0;
                let pitch = 0;
                const initialDir = new BABYLON.Vector3(0, 1, 0);
                camera.target = camera.position.add(initialDir);

                // ─── Pointer Lock & Mouse Handling ──────────────────
                let isLocked = false;
                const lockHint = document.getElementById("lock-hint");

                canvas.addEventListener("click", () => {
                    if (!document.pointerLockElement) {
                        canvas.requestPointerLock();
                    }
                });

                document.addEventListener("pointerlockchange", () => {
                    isLocked = (document.pointerLockElement === canvas);
                    lockHint.classList.toggle("hidden", isLocked);
                    canvas.style.cursor = isLocked ? "none" : "default";
                });

                document.addEventListener("mousemove", (event) => {
                    if (!isLocked) return;
                    const deltaX = event.movementX || 0;
                    const deltaY = event.movementY || 0;
                    yaw -= deltaX * MOUSE_SENSITIVITY;
                    pitch -= deltaY * MOUSE_SENSITIVITY;
                    pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
                });

                // ─── SKYDOME ─────────────────────────────────────────
                const skybox = BABYLON.MeshBuilder.CreateSphere(
                    "skyBox", { segments: 12, diameter: VIEW_DISTANCE * 2.0 }, scene
                );
                const skyMat = new BABYLON.StandardMaterial("skyBoxMat", scene);
                skyMat.backFaceCulling = false;
                skyMat.emissiveColor = horizonColor.clone(); // Skybox matches the new blue
                skyMat.disableLighting = true;
                skybox.material = skyMat;
                skybox.applyFog = false;

                // ─── TILE SYSTEM ─────────────────────────────────────
                const activeTiles = new Map();
                const inputMap = {};

                window.addEventListener("keydown", (e) => { inputMap[e.code] = true; });
                window.addEventListener("keyup", (e) => { inputMap[e.code] = false; });
                window.addEventListener("DOMContentLoaded", () => canvas.focus());
                canvas.addEventListener("click", () => canvas.focus());

                function createTileMesh(tx, ty) {
                    const name = `tile_${tx}_${ty}`;
                    const tile = BABYLON.MeshBuilder.CreatePlane(name, {
                        width: TILE_SIZE,
                        height: TILE_SIZE
                    }, scene);
                    tile.position.x = tx * TILE_SIZE;
                    tile.position.y = ty * TILE_SIZE;
                    tile.position.z = 0;

                    const mat = new BABYLON.StandardMaterial(`mat_${name}`, scene);
                    const tex = new BABYLON.Texture(TEXTURE_URL, scene);
                    tex.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
                    tex.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
                    const scale = TILE_SIZE * TEXTURE_REPEAT_PER_UNIT;
                    tex.uScale = scale;
                    tex.vScale = scale;
                    const offset = tx * TILE_SIZE * TEXTURE_REPEAT_PER_UNIT;
                    const offsetY = ty * TILE_SIZE * TEXTURE_REPEAT_PER_UNIT;
                    tex.uOffset = offset;
                    tex.vOffset = offsetY;

                    mat.diffuseTexture = tex;
                    mat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
                    mat.backFaceCulling = false;

                    tex.onLoadError = () => {
                        mat.diffuseColor = new BABYLON.Color3(0.5, 0.6, 0.5);
                    };

                    tile.material = mat;
                    return tile;
                }

                function updateTiles() {
                    const px = camera.position.x;
                    const py = camera.position.y;
                    const cx = Math.round(px / TILE_SIZE);
                    const cy = Math.round(py / TILE_SIZE);
                    const visible = new Set();

                    for (let dx = -TILE_RADIUS; dx <= TILE_RADIUS; dx++) {
                        for (let dy = -TILE_RADIUS; dy <= TILE_RADIUS; dy++) {
                            const tx = cx + dx;
                            const ty = cy + dy;
                            const wx = tx * TILE_SIZE;
                            const wy = ty * TILE_SIZE;
                            const dist = Math.hypot(px - wx, py - wy);
                            if (dist <= VIEW_DISTANCE) {
                                const key = `${tx},${ty}`;
                                visible.add(key);
                                if (!activeTiles.has(key)) {
                                    activeTiles.set(key, createTileMesh(tx, ty));
                                }
                            }
                        }
                    }

                    for (const [key, mesh] of activeTiles) {
                        if (!visible.has(key)) {
                            mesh.dispose(false, true);
                            activeTiles.delete(key);
                        }
                    }
                    document.getElementById("tileDisplay").innerText = activeTiles.size;
                }

                // ─── RENDER LOOP ─────────────────────────────────────
                scene.onBeforeRenderObservable.add(() => {
                    const dt = engine.getDeltaTime() / 1000;
                    const speed = MOVE_SPEED * dt;

                    // Compute forward direction from yaw/pitch
                    const forward = new BABYLON.Vector3(
                        Math.sin(yaw) * Math.cos(pitch),
                        Math.cos(yaw) * Math.cos(pitch),
                        Math.sin(pitch)
                    );
                    forward.normalize();
                    camera.target = camera.position.add(forward);

                    // Horizontal forward for movement
                    let horizontalForward = new BABYLON.Vector3(forward.x, forward.y, 0);
                    if (horizontalForward.lengthSquared() > 0.0001) {
                        horizontalForward.normalize();
                    } else {
                        horizontalForward = new BABYLON.Vector3(0, 1, 0);
                    }
                    const up = new BABYLON.Vector3(0, 0, 1);
                    const right = BABYLON.Vector3.Cross(horizontalForward, up);
                    if (right.lengthSquared() > 0.0001) right.normalize();

                    // Keyboard movement
                    let moveVec = new BABYLON.Vector3(0, 0, 0);
                    if (inputMap["KeyW"]) moveVec.addInPlace(horizontalForward);
                    if (inputMap["KeyS"]) moveVec.addInPlace(horizontalForward.scale(-1));
                    if (inputMap["KeyA"]) moveVec.addInPlace(right.scale(-1));
                    if (inputMap["KeyD"]) moveVec.addInPlace(right);
                    if (inputMap["KeyE"]) moveVec.addInPlace(up);
                    if (inputMap["KeyQ"]) moveVec.addInPlace(up.scale(-1));

                    if (moveVec.lengthSquared() > 0) {
                        moveVec.normalize().scaleInPlace(speed);
                        camera.position.addInPlace(moveVec);
                    }

                    skybox.position.copyFrom(camera.position);
                    updateTiles();

                    document.getElementById("posDisplay").innerText =
                        `X: ${camera.position.x.toFixed(0)}  Y: ${camera.position.y.toFixed(0)}  Z: ${camera.position.z.toFixed(0)}`;
                    document.getElementById("yawDisplay").innerText = (yaw * 180 / Math.PI).toFixed(1);
                    document.getElementById("pitchDisplay").innerText = (pitch * 180 / Math.PI).toFixed(1);
                });

                return scene;
            };

            // ─── BOOT ────────────────────────────────────────────────
            const scene = createScene();
            engine.runRenderLoop(() => scene.render());
            window.addEventListener("resize", () => engine.resize());
            document.addEventListener("click", () => canvas.focus());
        })();
    </script>
</body>
</html>
